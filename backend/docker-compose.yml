version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-news_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news_user} -d ${POSTGRES_DB:-news_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - news_net

  admin-panel:
    build: ./admin
    container_name: news_admin_panel
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-news_engine}
      - DB_USER=${POSTGRES_USER:-news_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-news_secret_pass}
      - ADMIN_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - news_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: news_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Istanbul}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-replace_with_a_secure_random_key_min_32_chars}
      # Database setup pointing to the dedicated Postgres instance
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-news_engine}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-news_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-news_secret_pass}
      - DB_POSTGRESDB_SCHEMA=public
      # Security & Execution settings
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - news_net

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  news_net:
    driver: bridge
